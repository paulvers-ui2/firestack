name: Build and Deploy AAR

on:
  release:
    types: [published]
  # Optional: allow manual runs for testing
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"
  PLATFORM_VERSION: "android-36"
  GOTOOLCHAIN: local

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firestack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Same as the release build in go.yml: newest patched Go, so the
          # .aar never ships a standard library with known vulnerabilities.
          go-version: '>=1.26'
          check-latest: true

      - name: Set up JDK (for Android/gomobile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "platforms;${{ env.PLATFORM_VERSION }}" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build AAR
        run: |
          chmod +x make-aar
          ./make-aar nogo nodebug

      - name: Verify build output
        run: |
          ls -la .
          test -f firestack.aar

      - name: Upload build artifact (CI record)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firestack-aar
          path: |
            firestack.aar
            build/intra/tun2socks-sources.jar
          if-no-files-found: error

      # --- 1. Attach AAR to the GitHub Release ---
      - name: Attach AAR to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firestack.aar
            build/intra/tun2socks-sources.jar

      # --- 2. Push AAR into paulvers-ui/rethink-app-masque:app/libs ---
      - name: Check push token
        if: github.event_name == 'release'
        env:
          PUSH_TOKEN: ${{ secrets.AAR_TO_RETHINK_DNS_MASQUE_REPO || secrets.RETHINK_APP_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error title=Missing secret::AAR_TO_RETHINK_DNS_MASQUE_REPO is not set in paulvers-ui2/firestack. Create a fine-grained token with Contents: read & write on paulvers-ui2/rethink-app-masque only, and save it as this repository secret."
            exit 1
          fi

      - name: Checkout rethink-app-masque
        if: github.event_name == 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: paulvers-ui2/rethink-app-masque
          token: ${{ secrets.AAR_TO_RETHINK_DNS_MASQUE_REPO || secrets.RETHINK_APP_PUSH_TOKEN }}
          path: rethink-app-masque

      - name: Copy AAR into rethink-app-masque
        if: github.event_name == 'release'
        run: |
          mkdir -p rethink-app-masque/app/libs
          cp firestack.aar rethink-app-masque/app/libs/firestack-local.aar
          cp build/intra/tun2socks-sources.jar rethink-app-masque/app/libs/ || true

      - name: Commit and push to rethink-app-masque
        if: github.event_name == 'release'
        working-directory: rethink-app-masque
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/libs/firestack-local.aar app/libs/tun2socks-sources.jar
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update firestack AAR to ${{ github.event.release.tag_name }} [skip ci]"
            git push origin HEAD
          fi
