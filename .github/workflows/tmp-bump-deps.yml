# ONE-TIME helper: computes go.sum for the dependency bump on the runner
# (which can reach proxy.golang.org / sum.golang.org), verifies the build,
# commits go.mod + go.sum, and deletes this file in that same commit.
name: tmp bump deps (self-deleting)
on:
  push:
    branches: [fix/xnet-vulns]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/xnet-vulns
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Bump, tidy, verify, commit
        run: |
          set -euo pipefail
          # Reachable vulns (govulncheck on n2): GO-2026-6617, -6612, -6611,
          # -6610, -6603 (fixed x/net 0.60.0), -5026, -4918; GO-2026-5970 (x/text).
          go get golang.org/x/net@v0.61.0 golang.org/x/text@v0.40.0
          go mod tidy
          go mod verify
          go vet ./intra/dnssecv/... ./intra/core/...
          go build ./...
          git rm -q .github/workflows/tmp-bump-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "deps: golang.org/x/net v0.61.0, golang.org/x/text v0.40.0

          Fixes the vulnerabilities govulncheck reports as reachable on n2:
          GO-2026-6617, GO-2026-6612, GO-2026-6611, GO-2026-6610, GO-2026-6603,
          GO-2026-5026, GO-2026-4918 (x/net http2) and GO-2026-5970 (x/text).
          Computed on the runner by the self-deleting tmp-bump-deps workflow."
          git diff --stat HEAD~1 HEAD
          git push origin HEAD:fix/xnet-vulns
